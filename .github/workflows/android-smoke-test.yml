
name: android-smoke-test

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/android-smoke-test.yml'

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      ANDROID_NDK_VERSION: '29.0.14206865'
      ANDROID_API_LEVEL: '35'
      ANDROID_BUILD_TOOLS: '35.0.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            git-lfs \
            glslc \
            gobject-introspection \
            libglib-perl \
            libglib-object-introspection-perl \
            libipc-run-perl \
            libjson-perl \
            libset-scalar-perl \
            libxml-libxml-perl \
            libxml-libxslt-perl \
            libxml2-utils \
            gir1.2-appstream \
            libglib2.0-dev-bin \
            ninja-build \
            pkg-config \
            sassc \
            unzip

      - name: Install Meson and Ninja
        run: |
          python3 -m pip install \
            --user \
            --upgrade \
            meson \
            ninja

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Verify Android toolchain
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "--- SDK packages ---"
          sdkmanager --list_installed | grep -E \
            'platforms;android|build-tools|ndk;' || true

          echo "--- NDK ---"
          test -d \
            "$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"

          echo "--- Java ---"
          java -version

          echo "--- Meson ---"
          meson --version

          echo "--- Ninja ---"
          ninja --version

      - name: Clone Pixiewood android36
        run: |
          git clone --depth=1 \
            --branch android36 \
            https://github.com/sp1ritCS/gtk-android-builder.git \
            pixiewood

      - name: Clone mini-studio
        run: |
          git clone --depth=1 \
            https://github.com/sp1ritCS/mini-studio.git \
            mini-studio

      - name: Clone GTK
        run: |
          git clone --depth=1 \
            https://gitlab.gnome.org/GNOME/gtk.git \
            gtk-src

      - name: Clone Meson development version
        run: |
          git clone --depth=1 \
            https://github.com/mesonbuild/meson.git \
            meson-src

      - name: Report Pixiewood and Meson
        run: |
          ./pixiewood/pixiewood --help || true

          ./meson-src/meson.py --version

          find pixiewood/prepare \
            -maxdepth 3 \
            -type f \
            | sort \
            | head -100

      - name: Prepare GTK Android app
        working-directory: gtk-src
        run: |
          ../pixiewood/pixiewood prepare \
            --release \
            -s "${ANDROID_HOME}" \
            -a ../mini-studio \
            --meson ../meson-src/meson.py \
            "build-aux/android/org.gtk.Demo4.xml"

      - name: Generate Android project
        working-directory: gtk-src
        run: |
          ../pixiewood/pixiewood generate

      - name: Build Android APK
        working-directory: gtk-src
        run: |
          ../pixiewood/pixiewood build

      - name: Locate APKs
        if: always()
        run: |
          echo "--- APK files ---"

          find gtk-src . -type f \
            \( -name '*.apk' -o -name '*.aab' \) \
            -print 2>/dev/null || true

          echo "--- Pixiewood output ---"

          find gtk-src/.pixiewood \
            -maxdepth 8 \
            -type f \
            2>/dev/null \
            | sort \
            | tail -100 || true

      - name: Upload APK artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtk-android-smoke-test
          path: |
            gtk-src/.pixiewood/android/app/build/outputs/**/*.apk
            gtk-src/.pixiewood/android/app/build/outputs/**/*.aab
            gtk-src/.pixiewood/android/app/build/outputs/**/*.json
            gtk-src/.pixiewood/android/app/build/outputs/**/*.txt
          if-no-files-found: warn

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtk-android-build-logs
          path: |
            gtk-src/.pixiewood/
            gtk-src/build/
            gtk-src/_build/
          if-no-files-found: warn
