
name: android-smoke-test

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-smoke-test.yml'

jobs:
  smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      # ---- Checkout -----------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---- Java ---------------------------------------------------------
      # pixiewood bundles Svg2Avd, which requires Java >= 17.
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ---- System dependencies -----------------------------------------
      - name: Install pixiewood Debian/Ubuntu dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib-perl \
            libglib-object-introspection-perl \
            libipc-run-perl \
            libjson-perl \
            libset-scalar-perl \
            libxml-libxml-perl \
            libxml-libxslt-perl \
            gir1.2-appstream \
            build-essential \
            glslc \
            gobject-introspection \
            libglib2.0-dev-bin \
            libxml2-utils \
            meson \
            ninja-build \
            sassc \
            git \
            pkg-config

      # ---- Rust ---------------------------------------------------------
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust Android targets
        run: |
          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # ---- Android SDK --------------------------------------------------
      # Install command-line tools and platform-tools.
      # Explicit packages avoids setup-android's default "tools" package.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 11076708
          packages: 'platform-tools'
          accept-android-sdk-licenses: 'true'

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses

      - name: Install Android NDK
        run: |
          sdkmanager --verbose \
            --install "ndk;26.1.10909125"

      # ---- Report versions ---------------------------------------------
      - name: Report toolchain versions
        run: |
          echo "--- meson ---"
          meson --version

          echo "--- ninja ---"
          ninja --version

          echo "--- rustc ---"
          rustc --version

          echo "--- cargo-ndk ---"
          cargo ndk --version || true

          echo "--- java ---"
          java -version

          echo "--- sdkmanager ---"
          sdkmanager --version

          echo "--- ANDROID_HOME ---"
          echo "${ANDROID_HOME:-not set}"

      # ---- Clone pixiewood ---------------------------------------------
      - name: Clone pixiewood (gtk-android-builder)
        run: |
          git clone --depth=1 \
            https://github.com/sp1ritCS/gtk-android-builder.git \
            pixiewood-src

      - name: Install pixiewood
        run: |
          sudo make -C pixiewood-src install

      - name: Report pixiewood version
        run: |
          pixiewood --help || true

      # ---- Clone GTK ----------------------------------------------------
      - name: Clone GTK (for demos and gdk/android)
        run: |
          git clone --depth=1 \
            https://gitlab.gnome.org/GNOME/gtk.git \
            gtk-src

      # ---- Pixiewood smoke test ----------------------------------------
      - name: Attempt to prepare GTK demo for Android
        working-directory: gtk-src
        run: |
          cat > /tmp/demo.pixiewood.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <app xmlns="https://sp1rit.arpa/pixiewood/">
            <metainfo vercalc="count">
              <!-- Placeholder: real appstream metainfo path TBD -->
            </metainfo>

            <style>
              <theme name="gtk"/>
            </style>

            <dependencies>
              <glib>
                <patch>hack</patch>
              </glib>
              <fontconfig/>
              <gtk/>
            </dependencies>

            <build target="gtk4-demo">
              <architectures>
                <arch>aarch64</arch>
              </architectures>
            </build>
          </app>
          EOF

          pixiewood prepare /tmp/demo.pixiewood.xml
          pixiewood generate
          pixiewood build

      # ---- Upload artifacts --------------------------------------------
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-output
          path: |
            gtk-src/**/*.apk
            gtk-src/build/
          if-no-files-found: warn
